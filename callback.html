<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok OAuth Callback</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 0 auto; padding: 48px 24px; color: #1a1a1a; line-height: 1.6; }
  h1 { font-size: 1.5rem; }
  .box { background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; padding: 16px; word-break: break-all; font-family: monospace; font-size: 0.9rem; margin: 12px 0; }
  .ok { color: #0a7d2c; }
  .err { color: #c0392b; }
  button { padding: 8px 16px; border: none; border-radius: 6px; background: #0066cc; color: #fff; cursor: pointer; font-size: 0.95rem; }
  button:hover { background: #0052a3; }
  .hint { font-size: 0.85rem; color: #666; }
</style>
</head>
<body>
  <h1>TikTok OAuth Callback</h1>
  <div id="content"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const errorDesc = params.get('error_description');
  const state = params.get('state');
  const el = document.getElementById('content');

  if (code) {
    el.innerHTML = `
      <p class="ok"><strong>&#10004; Authorization successful!</strong></p>
      <p>Authorization code (valid ~5 minutes, single use):</p>
      <div class="box" id="code">${code}</div>
      <button onclick="copyCode()">Copy code</button>
      <p class="hint">${state ? 'state: ' + state + '<br>' : ''}Paste this code into the token exchange script now.</p>
    `;
  } else if (error) {
    el.innerHTML = `
      <p class="err"><strong>&#10008; Authorization failed</strong></p>
      <div class="box">error: ${error}<br>${errorDesc ? 'description: ' + errorDesc : ''}</div>
    `;
  } else {
    el.innerHTML = `<p>No <code>code</code> or <code>error</code> parameter found in the URL. Start the OAuth flow first.</p>`;
  }

  function copyCode() {
    navigator.clipboard.writeText(document.getElementById('code').textContent.trim())
      .then(() => alert('Copied!'));
  }
</script>
</body>
</html>
